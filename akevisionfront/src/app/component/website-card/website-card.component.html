<!-- website-card.component.html -->
<div class="card" [ngClass]="{'gris': website.couleur === 'gris', 'rouge': website.couleur === 'rouge', 'orange': website.couleur === 'orange', 'vert': website.couleur === 'vert'}" (click)="openUpdateDialog()">
  <div class="card-body">
    <h5 class="card-title">{{ website.nameWebsite }}</h5>
    <p class="card-text">{{ website.url }}</p>
    <p class="card-text">SSL Expiration: {{ website.ssl_expiration }}</p>
  </div>
</div>
