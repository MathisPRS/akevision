<!-- website-dialog.component.html -->
<h1 mat-dialog-title>Ajouter un Site Web</h1>
<div mat-dialog-content>
  <form [formGroup]="websiteForm">
    <mat-form-field>
      <mat-label>Nom du Site</mat-label>
      <input formControlName="nameWebsite" matInput>
    </mat-form-field>
    <mat-form-field>
      <mat-label>URL/DNS</mat-label>
      <input formControlName="url" matInput>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Etre alerté</mat-label>
      <mat-select formControlName="alerte">
        <mat-option value="Oui">Oui</mat-option>
        <mat-option value="Non">Non</mat-option>
      </mat-select>
    </mat-form-field>
    <button mat-raised-button (click)="openGroupeWebsiteDialog()">
      {{ selectedGroupName ? selectedGroupName : 'Affecter à un groupe' }}
    </button>
    <div mat-dialog-actions>
      <button mat-button mat-dialog-close>Annuler</button>
      <button mat-button (click)="onSubmit()" [disabled]="websiteForm.invalid">Ajouter</button>
    </div>
  </form>
</div>
